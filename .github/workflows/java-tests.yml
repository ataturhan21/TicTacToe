name: Tic Tac Toe checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test turn sequencing without a display
        run: |
          javac -d /tmp/tictactoe-tests tictactoe/src/main/java/com/fx/tictactoejavafx/TurnState.java tests/TurnStateTest.java
          java -cp /tmp/tictactoe-tests com.fx.tictactoejavafx.TurnStateTest
      - name: Compile the JavaFX application
        run: mvn --batch-mode --no-transfer-progress -f tictactoe/pom.xml package
